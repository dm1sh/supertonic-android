name: Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build and sign debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Configure local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" >> local.properties

      - name: Add NDK toolchain to PATH
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Configure vendored Rust dependencies
        run: |
          cd rust
          cargo vendor vendor
          mkdir -p .cargo
          cat <<'EOF' > .cargo/config.toml
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android34-clang"
          [target.armv7-linux-androideabi]
          linker = "armv7a-linux-androideabi34-clang"
          [target.i686-linux-android]
          linker = "i686-linux-android34-clang"
          [target.x86_64-linux-android]
          linker = "x86_64-linux-android34-clang"
          [source.crates-io]
          replace-with = "vendored-sources"
          [source.vendored-sources]
          directory = "vendor"
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calculate monotonic debug version code
        id: version
        shell: bash
        run: |
          # run_number increases for every invocation of this workflow. The
          # offset keeps debug builds above the released app's historical
          # version codes while leaving room for future runs.
          DEBUG_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))
          if (( DEBUG_VERSION_CODE > 2147483647 )); then
            echo "Computed versionCode is too large: ${DEBUG_VERSION_CODE}" >&2
            exit 1
          fi
          echo "debug_version_code=${DEBUG_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Building debug versionCode=${DEBUG_VERSION_CODE}"

      - name: Build debug APK
        run: ./gradlew assembleDebug -PrustTargets=arm64 -PdebugVersionCode=${{ steps.version.outputs.debug_version_code }}

      - name: Sign debug APK with the release key
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.0'

      - name: Rename signed debug APK
        id: artifact
        shell: bash
        env:
          DEBUG_VERSION_CODE: ${{ steps.version.outputs.debug_version_code }}
        run: |
          SIGNED_APK="${{ steps.sign_apk.outputs.signedReleaseFile }}"
          test -f "$SIGNED_APK"
          OUTPUT="app/build/outputs/apk/debug/Supertonic-debug-${DEBUG_VERSION_CODE}.apk"
          mv "$SIGNED_APK" "$OUTPUT"
          echo "path=${OUTPUT}" >> "$GITHUB_OUTPUT"

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Supertonic-debug-${{ steps.version.outputs.debug_version_code }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30
